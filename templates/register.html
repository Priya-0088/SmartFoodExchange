
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join FoodBridge</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 15px;
            background: linear-gradient(135deg, #e3f8ed, #e7f5f5, #f2fbea);
        }

        .register-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.10);
        }

        .register-card h1 {
            text-align: center;
            color: #167b58;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #345447;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5e5dc;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: #fbfefd;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #21966b;
            box-shadow: 0 0 0 3px rgba(33,150,107,0.10);
        }

        .role-fields {
            display: none;
            padding: 18px;
            background: #f0faf4;
            border-radius: 12px;
            margin: 8px 0 20px;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #159765, #08734e);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #12865b;
            font-weight: bold;
            text-decoration: none;
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fff0ef;
            color: #b42318;
        }

        @media(max-width: 550px) {
            .register-card {
                padding: 25px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">
    <div class="register-card">

        <h1>🌱 Join FoodBridge</h1>
        <p class="register-subtitle">
            Together, let's reduce food waste and feed communities.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-grid">

                <div class="form-group full">
                    <label>Account Type *</label>
                    <select name="role" id="role" required onchange="showRoleFields()">
                        <option value="">Select account type</option>
                        <option value="DONOR">Food Donor</option>
                        <option value="NGO">NGO / Organization</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" required maxlength="100"
                           placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" required maxlength="100"
                           placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" required minlength="8"
                           placeholder="Minimum 8 characters">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" maxlength="15"
                           placeholder="Enter phone number">
                </div>

                <div class="form-group full">
                    <label>Address</label>
                    <input type="text" name="address" maxlength="255"
                           placeholder="Enter your address">
                </div>

                <div class="form-group full">
                    <label>City</label>
                    <input type="text" name="city" maxlength="100"
                           placeholder="Enter your city">
                </div>

            </div>

            <!-- DONOR FIELDS -->
            <div id="donorFields" class="role-fields">
                <h3>🍱 Donor Details</h3>

                <div class="form-group">
                    <label>Donor Type *</label>
                    <select name="donor_type" id="donor_type">
                        <option value="">Select donor type</option>
                        <option value="RESTAURANT">Restaurant</option>
                        <option value="SUPERMARKET">Supermarket</option>
                        <option value="HOTEL">Hotel</option>
                        <option value="INDIVIDUAL">Individual</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Organization Name</label>
                    <input type="text" name="donor_organization"
                           maxlength="150" placeholder="Organization name (optional)">
                </div>
            </div>

            <!-- NGO FIELDS -->
            <div id="ngoFields" class="role-fields">
                <h3>🤝 NGO Details</h3>

                <div class="form-group">
                    <label>Organization Name *</label>
                    <input type="text" name="organization_name"
                           id="organization_name" maxlength="150"
                           placeholder="Enter NGO name">
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input type="text" name="registration_number"
                           maxlength="100" placeholder="Registration number (optional)">
                </div>

                <div class="form-group">
                    <label>Service Area</label>
                    <input type="text" name="service_area"
                           maxlength="150" placeholder="Areas served">
                </div>
            </div>

            <button type="submit" class="register-button">
                Create My Account →
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>
</div>

<script>
function showRoleFields() {
    const role = document.getElementById("role").value;

    const donorFields = document.getElementById("donorFields");
    const ngoFields = document.getElementById("ngoFields");

    const donorType = document.getElementById("donor_type");
    const ngoName = document.getElementById("organization_name");

    donorFields.style.display = "none";
    ngoFields.style.display = "none";

    donorType.required = false;
    ngoName.required = false;

    if (role === "DONOR") {
        donorFields.style.display = "block";
        donorType.required = true;
    }

    if (role === "NGO") {
        ngoFields.style.display = "block";
        ngoName.required = true;
    }
}
</script>

</body>
</html>
