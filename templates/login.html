
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FoodBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #dff7e9, #e6f5f5, #f1fbe8);
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px 35px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.10);
            text-align: center;
        }

        .login-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .login-card h1 {
            color: #167b58;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #345447;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5e5dc;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fbfefd;
        }

        .form-group input:focus {
            border-color: #21966b;
            box-shadow: 0 0 0 3px rgba(33,150,107,0.10);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #159765, #08734e);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .register-link {
            margin-top: 25px;
            color: #777;
        }

        .register-link a {
            color: #12865b;
            font-weight: bold;
            text-decoration: none;
        }

        .flash-message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fff0ef;
            color: #b42318;
            text-align: left;
        }

        @media(max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">🌱</div>

        <h1>Welcome Back!</h1>

        <p class="login-subtitle">
            Login to FoodBridge and help us build a world with zero food waste.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                    maxlength="100">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-button">
                Login to FoodBridge →
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>

</div>

</body>
</html>
